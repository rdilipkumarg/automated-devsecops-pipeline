name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest


  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2


  sast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: semgrep scan --config p/python .

  dependency-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: 1

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show commit being built
        run: git log -1 --oneline

      - name: Build Docker image
        run: docker build --pull --no-cache -t devsecops-lab:latest .

      - name: Verify package versions
        run: |
          docker run --rm devsecops-lab:latest python -c "import msgpack, setuptools; print('msgpack:', msgpack.__version__); print('setuptools:', setuptools.__version__)"

      - name: Show installed packages
        run: |
          docker run --rm devsecops-lab:latest pip list | grep -E "msgpack|setuptools"
      - name: Inspect Python package metadata
        run: |
          docker run --rm devsecops-lab:latest sh -c "find /usr/local/lib/python3.13/site-packages -maxdepth 1 \( -iname '*msgpack*' -o -iname '*setuptools*' \) -print"

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-lab:latest
          format: json
          output: trivy-results.json
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Inspect Python installation
        run: |
          docker run --rm devsecops-lab:latest sh -c "
          echo '--- Python ---'
          python --version

          echo '--- Pip ---'
          pip --version
  
          echo '--- msgpack ---'
          pip show msgpack

          echo '--- setuptools ---'
          pip show setuptools

          echo '--- Python paths ---'
          python -c 'import sys; print(\"\\n\".join(sys.path))'

          echo '--- Package metadata files ---'
          find /usr/local/lib/python3.13/site-packages \
           \( -iname '*msgpack*' -o -iname '*setuptools*' \) \
           -print
          "

      - name: Inspect Trivy results
        run: |
          python - <<'PY'
          import json

          with open("trivy-results.json") as f:
             data = json.load(f)

          for result in data.get("Results", []):
             print("\nTARGET:", result.get("Target"))
             print("TYPE:", result.get("Type"))

             for vuln in result.get("Vulnerabilities") or []:
                 if vuln.get("PkgName") in ["msgpack", "setuptools"]:
                   print(
                    "PACKAGE:",
                    vuln.get("PkgName"),
                    "| INSTALLED:",
                    vuln.get("InstalledVersion"),
                    "| FIXED:",
                    vuln.get("FixedVersion"),
                    "| CVE:",
                    vuln.get("VulnerabilityID")
                    )
          PY

      - name: Inspect Docker image layers
        run: docker history devsecops-lab:latest