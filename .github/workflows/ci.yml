name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

env:
  IMAGE_NAME: devsecops-lab:latest
  CONTAINER_NAME: devsecops-app
  APP_PORT: 5001

jobs:

  # ============================================================
  # 1. UNIT TESTS
  # ============================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          pytest -v


  # ============================================================
  # 2. SAST - SEMGREP
  # ============================================================
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/python
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}


  # ============================================================
  # 3. SECRET SCANNING - GITLEAKS
  # ============================================================
  secrets:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # 4. SOFTWARE COMPOSITION ANALYSIS - TRIVY
  # ============================================================
  dependency-scan:
    name: Dependency Scan - Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          trivyignores: .trivyignore


  # ============================================================
  # 5. BUILD DOCKER IMAGE
  # ============================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - test
      - sast
      - secrets
      - dependency-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show commit being built
        run: |
          git log -1 --oneline

      - name: Build Docker image
        run: |
          docker build \
            --pull \
            --no-cache \
            -t ${{ env.IMAGE_NAME }} .


      # ========================================================
      # VERIFY APPLICATION DEPENDENCIES
      # ========================================================
      - name: Verify Python packages
        run: |
          docker run --rm ${{ env.IMAGE_NAME }} pip list

      # ========================================================
      # VERIFY APPLICATION STARTUP
      # ========================================================
      - name: Start application container
        run: |
          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} \
            ${{ env.IMAGE_NAME }}

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:${{ env.APP_PORT }}; then
              echo "Application is ready"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed to start"
          docker logs ${{ env.CONTAINER_NAME }}
          exit 1

      # ========================================================
      # SECURITY HEADERS
      # ========================================================
      - name: Verify security headers
        run: |
          curl -I http://localhost:${{ env.APP_PORT }}

      # ========================================================
      # TRIVY CONTAINER SCAN
      # ========================================================
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          trivyignores: .trivyignore

      # ========================================================
      # TRIVY JSON REPORT
      # ========================================================
      - name: Generate Trivy report
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0
          trivyignores: .trivyignore

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-report
          path: trivy-results.json

      # ========================================================
      # CLEANUP
      # ========================================================
      - name: Stop application
        if: always()
        run: |
          docker stop ${{ env.CONTAINER_NAME }} || true
          docker rm ${{ env.CONTAINER_NAME }} || true


  # ============================================================
  # 6. DAST - OWASP ZAP
  # ============================================================
  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --pull \
            --no-cache \
            -t ${{ env.IMAGE_NAME }} .

      - name: Start application
        run: |
          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} \
            ${{ env.IMAGE_NAME }}

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:${{ env.APP_PORT }}; then
              echo "Application is ready"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed to start"

          docker logs ${{ env.CONTAINER_NAME }}

          exit 1

      # ========================================================
      # OWASP ZAP BASELINE SCAN
      # ========================================================
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:${{ env.APP_PORT }}

      # ========================================================
      # CLEANUP
      # ========================================================
      - name: Stop application
        if: always()
        run: |
          docker stop ${{ env.CONTAINER_NAME }} || true
          docker rm ${{ env.CONTAINER_NAME }} || true